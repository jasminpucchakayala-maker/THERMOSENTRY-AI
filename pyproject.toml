[project]
name = "thermosentry-ai"
version = "0.1.0"
description = "Thermosentry AI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
